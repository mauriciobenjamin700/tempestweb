name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy tempestweb
      - name: Test
        run: uv run pytest -q

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - name: JS client tests (jsdom)
        run: node --test "tests/client/**/*.test.js"

  a11y:
    name: Accessibility gate (axe-core)
    runs-on: ubuntu-latest
    # Blocking on purpose (Track S — S10). docs/stability.md declares an
    # accessibility baseline; before this job nothing measured one, and an
    # IconButton shipped as an unfocusable div with no accessible name (#109).
    # The Lighthouse job in pwa.yml stays a soft signal — it owns contrast and
    # installability, which need a real browser.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --all-extras
      - name: The scenes are generated from the example apps, not hand-written
        run: |
          uv run python -m tests.conformance._a11y_scenes
          git diff --exit-code tests/fixtures/a11y_scenes.json
      - name: axe-core over the DOM the renderer builds
        run: node scripts/a11y-gate.mjs

  perf:
    name: Performance gate (reconciler + Mode B throughput)
    runs-on: ubuntu-latest
    # Blocking, and built to survive a shared runner (Track S — S9): it asserts
    # scale ratios and calibrated cost, not wall-clock milliseconds. An absolute
    # threshold on a shared runner either fires on noise — and gets disabled in
    # the first week — or is loose enough to catch nothing. The Mode A cold start
    # needs a real browser and a Pyodide download, so it runs on a schedule in
    # perf-cold-start.yml instead of in a PR's critical path.
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --all-extras
      - name: Reconciler + throughput regression gate
        run: uv run python benchmarks/perf_gate.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Dependency vulnerability audit (Track S — S7)
        run: uvx pip-audit
