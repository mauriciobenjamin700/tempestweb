name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy tempestweb
      # The anchor guard in tests/unit/test_docs_quality.py reads the BUILT html:
      # MkDocs reports a broken heading anchor as INFO, so `--strict` alone stays
      # green while a cross-page link quietly drops the reader at the top of the
      # page. Without this step the guard skips, and a skipped guard guards
      # nothing. `uv sync --all-extras` above already installed mkdocs.
      - name: Build the docs site (the anchor guard reads it)
        run: uv run mkdocs build --strict
      - name: Test
        run: uv run pytest -q

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - name: JS client tests (jsdom)
        run: node --test "tests/client/**/*.test.js"

  a11y:
    name: Accessibility gate (axe-core)
    runs-on: ubuntu-latest
    # Blocking on purpose (Track S — S10). docs/stability.md declares an
    # accessibility baseline; before this job nothing measured one, and an
    # IconButton shipped as an unfocusable div with no accessible name (#109).
    # Structural rules only, in jsdom: contrast needs layout and is measured by
    # the `contrast` job below, in a real browser.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --all-extras
      - name: The scenes are generated from the example apps, not hand-written
        run: |
          uv run python -m tests.conformance._a11y_scenes
          git diff --exit-code tests/fixtures/
      - name: axe-core over the DOM the renderer builds
        run: node scripts/a11y-gate.mjs

  contrast:
    name: Contrast gate (axe color-contrast, real Chromium)
    runs-on: ubuntu-latest
    # Blocking, and the other half of the a11y gate (#202). `color-contrast` is
    # the one rule the axe job switches off, because jsdom produces no laid-out
    # box to sample colours from — it was delegated to a Lighthouse layer that
    # audited nothing for its whole life (#201). Chromium is what closes it: the
    # same generated scenes, the same renderer, but with real layout, in both
    # themes. A whole dark palette shipped without CI able to tell a legible one
    # from an illegible one (#148); that is what this measures.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --all-extras
      - name: The scenes are generated from the example apps, not hand-written
        run: |
          uv run python -m tests.conformance._a11y_scenes
          git diff --exit-code tests/fixtures/
      - name: Install a browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: axe color-contrast over the painted DOM, light and dark
        run: node scripts/contrast-gate.mjs
      - name: And the proof that the gate bites
        run: node --test tests/client/contrast-gate.test.js

  perf:
    name: Performance gate (reconciler + Mode B throughput)
    runs-on: ubuntu-latest
    # Blocking, and built to survive a shared runner (Track S — S9): it asserts
    # scale ratios and calibrated cost, not wall-clock milliseconds. An absolute
    # threshold on a shared runner either fires on noise — and gets disabled in
    # the first week — or is loose enough to catch nothing. The Mode A cold start
    # needs a real browser and a Pyodide download, so it runs on a schedule in
    # perf-cold-start.yml instead of in a PR's critical path.
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --all-extras
      - name: Reconciler + throughput regression gate
        run: uv run python benchmarks/perf_gate.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Dependency vulnerability audit (Track S — S7)
        run: uvx pip-audit
