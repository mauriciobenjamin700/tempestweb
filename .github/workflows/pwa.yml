name: PWA Gate

# Track P / P4 — locks PWA + offline + push regressions automatically.
#
# Three layers, fast to slow:
#   1. unit      — the manifest/sw/offline/webpush unit tests (always run).
#   2. pwa-audit — a real Chromium driven over a real `tempestweb build` artifact,
#                  asserting installability and an offline reload. Blocking.
#   3. push-e2e  — a Playwright end-to-end (subscribe -> server send -> notification)
#                  wired but allowed to be skipped where push is unavailable in CI.
#
# Layer 2 used to be a Lighthouse job asserting the `pwa` category. Lighthouse 12
# removed that category, so six of its seven assertions name audits that no longer
# exist in a report (measured on 12.1.0). It was also wrapped in
# `continue-on-error` plus `|| echo soft-fail`, over a `staticDistDir` no step
# built — so it passed every PR without auditing a page. `scripts/pwa-audit.mjs`
# measures what P4 actually wanted, in a browser that still ships the feature.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: PWA unit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - name: Service worker syntax check
        run: node --check client/sw/sw.js && node --check client/sw/sw-teardown.js
      - name: PWA client tests (manifest, sw, offline, push)
        run: >-
          node --test
          tests/client/pwa-install-prompt.test.js
          tests/client/pwa-manifest.test.js
          tests/client/sw-strategies.test.js
          tests/client/sw-register.test.js
          tests/client/offline-store.test.js
          tests/client/offline-sync.test.js
          tests/client/web-push-client.test.js
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install (with webpush extra)
        run: uv sync --extra dev --extra server --extra webpush
      - name: PWA Python tests (manifest emitter + webpush)
        run: uv run pytest tests/unit/test_pwa*.py -q

  pwa-audit:
    name: PWA audit (installable + offline, real Chromium)
    runs-on: ubuntu-latest
    # Blocking on purpose: this is the job P4 promised ("Trava o merge"). It audits
    # the Mode C artifact because the PWA shell — manifest emitter, icons, service
    # worker — is shared across modes, and Mode C needs no Pyodide download in a
    # PR's critical path. A Mode A audit needs `build --offline` (it vendors the
    # runtime), which belongs in a scheduled job like perf-cold-start.yml.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --all-extras
      - name: Validate the manifest the builder emits (no browser needed)
        run: node scripts/pwa-gate.mjs
      - name: Build a real artifact
        run: uv run tempestweb build --mode transpile --path examples/counter
      - name: Install a browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve the artifact
        run: |
          python3 -m http.server 8000 --directory examples/counter/dist/transpile &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
      - name: Audit it in Chromium
        run: node scripts/pwa-audit.mjs http://127.0.0.1:8000/

  push-e2e:
    name: WebPush e2e (subscribe -> send -> notify)
    runs-on: ubuntu-latest
    # E2E push needs a served app + a push-capable headless browser. Wired here;
    # soft until a test VAPID pair is provisioned in CI. Tracked separately — the
    # WebPush path itself was measured by hand against real FCM
    # (docs/agents/device-verification.md), so the gap here is CI, not behavior.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - name: Push e2e smoke (placeholder until a VAPID pair exists in CI)
        run: node scripts/pwa-gate.mjs --push-smoke
